services:
  - type: web
    name: mediscan-india
    runtime: python
    plan: free
    # Keep the production image lean; scans use Gemini's native image input.
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python prepare_dataset.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: ORT_INTRA_OP_NUM_THREADS
        value: "1"
      - key: ORT_INTER_OP_NUM_THREADS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
