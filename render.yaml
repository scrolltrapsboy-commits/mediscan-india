services:
  - type: web
    name: mediscan-india
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps rapidocr-onnxruntime==1.2.3
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DRUGSETU_API_KEY
        sync: false        # set the real key in the Render dashboard, never in git
