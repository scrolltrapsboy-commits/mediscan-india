services:
  - type: web
    name: mediscan-india
    runtime: python
    plan: free
    # Fail the build if RapidOCR is not actually installed.
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m pip install --no-deps rapidocr-onnxruntime==1.2.3 &&
      python -c "from rapidocr_onnxruntime import RapidOCR; print('RapidOCR package import OK')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
